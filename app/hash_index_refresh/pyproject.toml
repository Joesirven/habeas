[project]
name = "hash-index-refresh-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "habeas-privacy-core",
    "dbt-bigquery>=1.9",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
habeas-privacy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hash_index_refresh"]

[project.scripts]
hash-index-refresh = "hash_index_refresh.main:run"
