[project]
name = "cassandra-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "habeas-privacy-core",
    "cassandra-driver>=3.29,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
]

[tool.uv.sources]
habeas-privacy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cassandra_worker"]
