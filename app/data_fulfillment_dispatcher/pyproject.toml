[project]
name = "data-fulfillment-dispatcher"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "habeas-privacy-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "google-cloud-bigquery>=3.27",
]

[tool.uv.sources]
habeas-privacy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_fulfillment_dispatcher"]

[project.scripts]
data-fulfillment-dispatcher = "data_fulfillment_dispatcher.main:run"
