[project]
name = "intake-drop-poller"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "habeas-privacy-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[tool.uv.sources]
habeas-privacy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/intake_drop_poller"]
