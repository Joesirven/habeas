[project]
name = "admin-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "habeas-privacy-core",
    "fastapi>=0.115",
    "httpx>=0.28",
    "uvicorn[standard]>=0.32",
    "sse-starlette>=2.0",
]

[tool.uv.sources]
habeas-privacy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/admin_api"]
