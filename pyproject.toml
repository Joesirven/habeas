[project]
name = "data-privacy"
version = "0.1.0"
description = "Habeas Data Privacy Request Automation monorepo"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "httpx>=0.28",
    "import-linter>=2.1",
]

[tool.uv.workspace]
# Explicit workspace members (wave 1). Globs libs/* app/* also work; list is for visibility.
members = [
    "libs/habeas-privacy-core",
    # control plane
    "app/admin_api",
    # pipeline
    "app/reaper",
    "app/matching",
    "app/request_dispatcher",
    "app/data_fulfillment_dispatcher",
    "app/drop_connector",
    "app/drop_ingestor",
    "app/drop_notice_dispatcher",
    "app/hash_index_refresh",
    "app/sla_monitor",
    # suppression (tier C — scaffold)
    "app/mailchimp",
    "app/paylocity",
    "app/lever",
    "app/auth0",
    "app/google_sheets",
    "app/cassandra",
    # cli
    "clients/cli/habeas-cli",
]

[tool.importlinter]
include_external_packages = true
root_packages = [
    "habeas_privacy_core",
    "reaper",
    "admin_api",
    "matching",
    "request_dispatcher",
    "data_fulfillment_dispatcher",
    "drop_connector",
    "drop_ingestor",
    "drop_notice_dispatcher",
    "hash_index_refresh",
    "mailchimp",
    "paylocity",
    "lever",
    "auth0",
    "google_sheets",
    "cassandra_worker",
    "sla_monitor",
    "habeas_cli",
]

[[tool.importlinter.contracts]]
name = "Domain and services must not import infra"
type = "forbidden"
source_modules = [
    "habeas_privacy_core",
    "reaper",
    "admin_api",
    "matching",
    "request_dispatcher",
    "data_fulfillment_dispatcher",
    "drop_connector",
    "drop_ingestor",
    "drop_notice_dispatcher",
    "hash_index_refresh",
    "mailchimp",
    "paylocity",
    "lever",
    "auth0",
    "google_sheets",
    "cassandra_worker",
    "sla_monitor",
    "habeas_cli",
]
forbidden_modules = [
    "infra",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["libs", "app", "clients/cli"]
