substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _SERVICE: auth0-dev
  _TAG: latest
  _CLOUDSQL_INSTANCE: example-gcp-project:us-east4:dpra-dev-temp
  _DRAIN_JOB: auth0-matching-drain-dev
  _RUNTIME_SA: 95660886550-compute@developer.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - -f
      - app/auth0/Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --timeout=3600
      - --set-env-vars=SERVICE_NAME=auth0,WORKER_ID=auth0-dev,GCP_PROJECT=${_PROJECT},LOG_LEVEL=INFO,DATABASE_URL=${_DATABASE_URL},EXTERNAL_HASH_DBT_DIR=/app/transform/external_hash,DBT_PROFILES_DIR=/app/transform/external_hash,EXTERNAL_HASH_BQ_DATASET=external_hash_index,EXTERNAL_HASH_DBT_TIMEOUT_SECONDS=3300,AUTH0_DRAIN_JOB_NAME=${_DRAIN_JOB},AUTH0_DRAIN_JOB_REGION=${_REGION},AUTH0_DRAIN_LEASE_HOLDER=auth0-matching-drain,AUTH0_DRAIN_TASK_COUNT=5,AUTH0_DRAIN_CHUNK_LIMIT=10000

  # admin-api-dev runtime SA only — never user/IAP run.invoker on workers
  - id: grant-admin-api-invoker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - add-iam-policy-binding
      - ${_SERVICE}
      - --region=${_REGION}
      - --member=serviceAccount:95660886550-compute@developer.gserviceaccount.com
      - --role=roles/run.invoker
      - --quiet

  # Auth0 matching drain Job — Method E shell (5 parallel tasks), same image.
  - id: deploy-drain-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}"
        gcloud run jobs deploy "${_DRAIN_JOB}" \
          --project="${_PROJECT}" \
          --region="${_REGION}" \
          --image="$${IMAGE}" \
          --tasks=5 \
          --parallelism=5 \
          --task-timeout=3600 \
          --max-retries=1 \
          --service-account="${_RUNTIME_SA}" \
          --set-cloudsql-instances="${_CLOUDSQL_INSTANCE}" \
          --command=python \
          --args=-m,auth0.chunk_drain \
          --set-env-vars="SERVICE_NAME=auth0-matching-drain,WORKER_ID=${_DRAIN_JOB},GCP_PROJECT=${_PROJECT},LOG_LEVEL=INFO,DATABASE_URL=${_DATABASE_URL},AUTH0_DRAIN_TASK_COUNT=5,AUTH0_DRAIN_CHUNK_LIMIT=10000,AUTH0_DRAIN_LEASE_HOLDER=auth0-matching-drain,PYTHONPATH=/app/app/auth0/src" \
          --quiet

        gcloud run jobs add-iam-policy-binding "${_DRAIN_JOB}" \
          --project="${_PROJECT}" \
          --region="${_REGION}" \
          --member="serviceAccount:${_RUNTIME_SA}" \
          --role="roles/run.developer" \
          --quiet || true

images:
  - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
