# Admin web QA front door — prod-shaped SPA on NON-PROD data.
# Same Architecture B experience as admin-web-prod (IAP SSO front door, GIS user
# JWT → admin-api, labs off), but every API hop points at admin-api-dev, so a QA
# tester cannot mutate prod. Never repoint this service at admin-api-prod.
#
# Deploy (client id is the public GIS/IAP OAuth client already baked on
# admin-web-dev; it must equal admin-api-dev IAP_OAUTH_CLIENT_ID):
#   gcloud builds submit --config=infra/cloudbuild/admin-web-qa.yaml --project=example-gcp-project .
#
# Grant an external tester who is not on the habeas.us Workspace domain:
#   ... --substitutions=_EXTRA_IAP_MEMBER="user:tester@example.com"
#
# admin-api-dev CORS_ORIGINS must include this origin or browser JSON fails
# preflight — see infra/cloudbuild/admin-api-dev.yaml.
substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _SERVICE: admin-web-qa
  _TAG: latest
  # Architecture B — browser calls admin-api-DEV directly. Non-prod data by design.
  _VITE_ADMIN_API_URL: "https://admin-api-dev-hsa55rg7ja-uk.a.run.app"
  # Public GIS / IAP OAuth client (same value as admin-web-dev.yaml). Safe to bake.
  _VITE_GOOGLE_CLIENT_ID: "95660886550-cpdl76minmdshvi7vcchcqivkjdna3f7.apps.googleusercontent.com"
  # QA mimics prod: labs stay off so /dev/* never ships on this link.
  _VITE_ENABLE_LABS: "false"
  # nginx same-origin /api (Server-Sent Events) also lands on admin-api-dev.
  _ADMIN_API_UPSTREAM: https://admin-api-dev-hsa55rg7ja-uk.a.run.app
  # Optional single extra IAP accessor for an off-domain tester. Empty = skip.
  _EXTRA_IAP_MEMBER: ""

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --build-arg
      - VITE_ADMIN_API_URL=${_VITE_ADMIN_API_URL}
      - --build-arg
      - VITE_GOOGLE_CLIENT_ID=${_VITE_GOOGLE_CLIENT_ID}
      - --build-arg
      - VITE_ENABLE_LABS=${_VITE_ENABLE_LABS}
      - -f
      - clients/web/Dockerfile
      - clients/web

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --max-instances=3
      - --min-instances=1
      - --set-env-vars=ADMIN_API_UPSTREAM=${_ADMIN_API_UPSTREAM}

  - id: enable-iap
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        # cloud-sdk:slim already ships beta; do not run components install.
        gcloud beta run services update ${_SERVICE} --region=${_REGION} --project=${_PROJECT} --iap --quiet
        gcloud run services add-iam-policy-binding ${_SERVICE} --region=${_REGION} --project=${_PROJECT} \
          --member=serviceAccount:service-95660886550@gcp-sa-iap.iam.gserviceaccount.com \
          --role=roles/run.invoker --quiet || true
        gcloud run services remove-iam-policy-binding ${_SERVICE} --region=${_REGION} --project=${_PROJECT} \
          --member=allUsers --role=roles/run.invoker --quiet || true
        # The Cloud Build SA lacks iap.webServices.*IamPolicy, so these accessor
        # grants no-op here (same as admin-web-dev/prod). They are applied once
        # out-of-band by a human with IAP admin; keep them for documentation.
        gcloud beta iap web add-iam-policy-binding --project=${_PROJECT} --region=${_REGION} \
          --resource-type=cloud-run --service=${_SERVICE} \
          --member=user:dev-owner-1@example.com --role=roles/iap.httpsResourceAccessor \
          --condition=None --quiet || true
        # Habeas Workspace domain — same operator login path as admin-web-dev.
        gcloud beta iap web add-iam-policy-binding --project=${_PROJECT} --region=${_REGION} \
          --resource-type=cloud-run --service=${_SERVICE} \
          --member=domain:habeas.us --role=roles/iap.httpsResourceAccessor \
          --condition=None --quiet || true
        if [ -n "${_EXTRA_IAP_MEMBER}" ]; then
          gcloud beta iap web add-iam-policy-binding --project=${_PROJECT} --region=${_REGION} \
            --resource-type=cloud-run --service=${_SERVICE} \
            --member=${_EXTRA_IAP_MEMBER} --role=roles/iap.httpsResourceAccessor \
            --condition=None --quiet || true
        fi

images:
  - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
