# data-vertical-matching-prod — same Method E drain as matching-dev.
# Requires a production Cloud SQL instance + _DATABASE_URL substitution.
# Jose-gated first prod cutover; Data Vertical Matching.
substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _SERVICE: data-vertical-matching-prod
  _TAG: latest
  # Override at submit time when prod SQL is provisioned.
  _CLOUDSQL_INSTANCE: example-gcp-project:us-east4:dpra-prod
  _RUNTIME_SA: 95660886550-compute@developer.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - -f
      - app/matching/Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --timeout=3600
      - --service-account=${_RUNTIME_SA}
      - --set-env-vars=SERVICE_NAME=matching,WORKER_ID=data-vertical-matching-prod,GCP_PROJECT=${_PROJECT},LOG_LEVEL=INFO,DATABASE_URL=${_DATABASE_URL},MATCHING_DRAIN_MAX_CHUNKS=50,MATCHING_DRAIN_TASK_COUNT=5,MATCHING_DRAIN_JOB_NAME=data-vertical-matching-drain-prod,MATCHING_DRAIN_JOB_REGION=${_REGION},MATCHING_DRAIN_LEASE_HOLDER=matching-drain-job

  # admin-api runtime SA only — never user/IAP run.invoker on workers. Never allUsers.
  - id: grant-admin-api-invoker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - add-iam-policy-binding
      - ${_SERVICE}
      - --region=${_REGION}
      - --member=serviceAccount:${_RUNTIME_SA}
      - --role=roles/run.invoker
      - --quiet

  - id: deploy-drain-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}"
        gcloud run jobs deploy data-vertical-matching-drain-prod \
          --project="${_PROJECT}" \
          --region="${_REGION}" \
          --image="$${IMAGE}" \
          --tasks=5 \
          --parallelism=5 \
          --task-timeout=3600 \
          --max-retries=1 \
          --service-account="${_RUNTIME_SA}" \
          --set-cloudsql-instances="${_CLOUDSQL_INSTANCE}" \
          --command=python \
          --args=-m,matching.chunk_drain \
          --set-env-vars="SERVICE_NAME=matching-drain,WORKER_ID=data-vertical-matching-drain-prod,GCP_PROJECT=${_PROJECT},LOG_LEVEL=INFO,DATABASE_URL=${_DATABASE_URL},MATCHING_DRAIN_MAX_CHUNKS=50,MATCHING_DRAIN_TASK_COUNT=5,MATCHING_DRAIN_LEASE_HOLDER=matching-drain-job,PYTHONPATH=/app/app/matching/src" \
          --quiet
        gcloud run jobs add-iam-policy-binding data-vertical-matching-drain-prod \
          --project="${_PROJECT}" \
          --region="${_REGION}" \
          --member="serviceAccount:${_RUNTIME_SA}" \
          --role="roles/run.developer" \
          --quiet || true

images:
  - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
