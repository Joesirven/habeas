# admin-api-prod — twin of admin-api-dev. Architecture B resource server.
# allUsers invoker is required so browser GIS user JWT can reach the app
# (aud = OAuth client; Cloud Run IAM would otherwise reject). App-level
# REQUIRE_IAP_IDENTITY still verifies the token. nginx compute SA remains
# invoker for same-origin /api (SSE + rollback). WITHOUT Cloud Run IAP
# (--no-iap). ops-ia-web is retired; do not re-add its CORS origin.
# DATABASE_URL from GSM database-url-prod via --set-secrets (not a Cloud Build
# substitution). Comma-delimited --set-env-vars truncates passwords that
# contain commas.
# Worker URLs use suffix hsa55rg7ja-uk. intake_drop_poller has no app — URL empty.
substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _SERVICE: admin-api-prod
  _TAG: latest
  # Prove-then-flip: never steal 100% from a healthy pin (00077 hang rollback).
  _REVISION_TAG: snapshot-hang
  _CLOUDSQL_INSTANCE: example-gcp-project:us-east4:dpra-prod
  _DROP_CONNECTOR_URL: https://drop-connector-prod-hsa55rg7ja-uk.a.run.app
  _DROP_INGESTOR_URL: https://drop-ingestor-prod-hsa55rg7ja-uk.a.run.app
  _REQUEST_DISPATCHER_URL: https://request-dispatcher-prod-hsa55rg7ja-uk.a.run.app
  _MATCHING_URL: https://data-vertical-matching-prod-hsa55rg7ja-uk.a.run.app
  _DATA_FULFILLMENT_URL: https://data-fulfillment-dispatcher-prod-hsa55rg7ja-uk.a.run.app
  _HASH_INDEX_REFRESH_URL: https://hash-index-refresh-prod-hsa55rg7ja-uk.a.run.app
  _REAPER_URL: https://reaper-prod-hsa55rg7ja-uk.a.run.app
  _INTAKE_DROP_POLLER_URL: ""
  # App-level identity required (Bearer Google ID token or IAP headers).
  _REQUIRE_IAP_IDENTITY: "true"
  # Browser GIS user ID tokens have aud = this OAuth client (same as VITE_GOOGLE_CLIENT_ID).
  _IAP_OAUTH_CLIENT_ID: "95660886550-cpdl76minmdshvi7vcchcqivkjdna3f7.apps.googleusercontent.com"
  # CLI / nginx ADC tokens have aud = this Cloud Run origin.
  _ADMIN_API_ID_TOKEN_AUDIENCE: "https://admin-api-prod-hsa55rg7ja-uk.a.run.app"
  # admin-web origins for Architecture B GIS. ops-ia-web is retired.
  _CORS_ORIGINS: "https://admin-web-prod-hsa55rg7ja-uk.a.run.app|https://admin-web-dev-hsa55rg7ja-uk.a.run.app|http://127.0.0.1:5174|http://localhost:5174|http://127.0.0.1:5173|http://localhost:5173|http://127.0.0.1:8080|http://localhost:8080"
  _ADMIN_API_SUPER_ADMINS: "dev-owner-1@example.com|dev-owner-9@example.com|dev-owner-6@example.com|dev-owner-12@example.com|dev-owner-4@example.com"
  _ADMIN_API_ADMINS: "dev-owner-3@example.com|dev-owner-13@example.com"
  _ADMIN_API_LEGALS: "dev-owner-3@example.com|dev-owner-5@example.com"
  _ADMIN_API_DATA_OWNERS: "dev-owner-10@example.com|dev-owner-11@example.com|dev-owner-15@example.com|mvirda@example.com|dev-owner-14@example.com|dev-owner-7@example.com"
  # Real V4 signed URLs for fulfillment artifacts; signer needs
  # roles/iam.serviceAccountTokenCreator on itself (signBlob).
  _GCS_TRANSPORT: google
  _GCS_SIGNING_SERVICE_ACCOUNT: 95660886550-compute@developer.gserviceaccount.com
  # Live Cloud Scheduler schedules (Workers Settings / Ops Configuration).
  _CLOUD_SCHEDULER_ENABLED: "true"
  _CLOUD_SCHEDULER_LOCATION: us-east4
  _CLOUD_SCHEDULER_JOB_PREFIX: dpra-prod
  _AXIOS_HEADQUARTERS_WORKER_URL: https://axios-headquarters-prod-hsa55rg7ja-uk.a.run.app
  _AXIOS_HEADQUARTERS_URL: https://axios-headquarters-prod-hsa55rg7ja-uk.a.run.app
  _AUTH0_URL: https://auth0-prod-hsa55rg7ja-uk.a.run.app
  _AUTH0_WORKER_URL: https://auth0-prod-hsa55rg7ja-uk.a.run.app
  _PAYLOCITY_URL: https://paylocity-prod-hsa55rg7ja-uk.a.run.app
  _PAYLOCITY_WORKER_URL: https://paylocity-prod-hsa55rg7ja-uk.a.run.app
  _LEVER_URL: https://lever-prod-hsa55rg7ja-uk.a.run.app
  _LEVER_WORKER_URL: https://lever-prod-hsa55rg7ja-uk.a.run.app
  _GOOGLE_SHEETS_URL: https://google-sheets-prod-hsa55rg7ja-uk.a.run.app
  _GOOGLE_SHEETS_WORKER_URL: https://google-sheets-prod-hsa55rg7ja-uk.a.run.app
  _DROP_NOTICE_URL: https://drop-notice-dispatcher-prod-hsa55rg7ja-uk.a.run.app
  # Owner mapped-upload CSVs (connections/{system}/{connection_id}/upload.csv).
  _CONNECTIONS_UPLOAD_BUCKET: gs://example-gcp-project-dpra-uploads
  # Live owner credentials must land in GSM. Never set SECRET_WRITER=memory here.

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - -f
      - app/admin_api/Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --no-traffic
      - --tag=${_REVISION_TAG}
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --timeout=3600
      - --cpu=2
      - --memory=2Gi
      - --max-instances=3
      - --min-instances=1
      - --concurrency=40
      - --session-affinity
      - --set-env-vars=SERVICE_NAME=admin-api,WORKER_ID=admin-api-prod,GCP_PROJECT=${_PROJECT},SECRET_WRITER=gcp,LOG_LEVEL=INFO,DROP_CONNECTOR_URL=${_DROP_CONNECTOR_URL},DROP_INGESTOR_URL=${_DROP_INGESTOR_URL},REQUEST_DISPATCHER_URL=${_REQUEST_DISPATCHER_URL},MATCHING_URL=${_MATCHING_URL},DATA_FULFILLMENT_URL=${_DATA_FULFILLMENT_URL},HASH_INDEX_REFRESH_URL=${_HASH_INDEX_REFRESH_URL},REAPER_URL=${_REAPER_URL},INTAKE_DROP_POLLER_URL=${_INTAKE_DROP_POLLER_URL},AUTH0_URL=${_AUTH0_URL},AUTH0_WORKER_URL=${_AUTH0_WORKER_URL},PAYLOCITY_URL=${_PAYLOCITY_URL},PAYLOCITY_WORKER_URL=${_PAYLOCITY_WORKER_URL},LEVER_URL=${_LEVER_URL},LEVER_WORKER_URL=${_LEVER_WORKER_URL},GOOGLE_SHEETS_URL=${_GOOGLE_SHEETS_URL},GOOGLE_SHEETS_WORKER_URL=${_GOOGLE_SHEETS_WORKER_URL},DROP_NOTICE_URL=${_DROP_NOTICE_URL},AXIOS_HEADQUARTERS_WORKER_URL=${_AXIOS_HEADQUARTERS_WORKER_URL},AXIOS_HEADQUARTERS_URL=${_AXIOS_HEADQUARTERS_URL},CONNECTIONS_UPLOAD_BUCKET=${_CONNECTIONS_UPLOAD_BUCKET},REQUIRE_IAP_IDENTITY=${_REQUIRE_IAP_IDENTITY},IAP_OAUTH_CLIENT_ID=${_IAP_OAUTH_CLIENT_ID},ADMIN_API_ID_TOKEN_AUDIENCE=${_ADMIN_API_ID_TOKEN_AUDIENCE},CORS_ORIGINS=${_CORS_ORIGINS},ADMIN_API_SUPER_ADMINS=${_ADMIN_API_SUPER_ADMINS},ADMIN_API_ADMINS=${_ADMIN_API_ADMINS},ADMIN_API_LEGALS=${_ADMIN_API_LEGALS},ADMIN_API_DATA_OWNERS=${_ADMIN_API_DATA_OWNERS},CLOUD_SCHEDULER_ENABLED=${_CLOUD_SCHEDULER_ENABLED},CLOUD_SCHEDULER_LOCATION=${_CLOUD_SCHEDULER_LOCATION},CLOUD_SCHEDULER_JOB_PREFIX=${_CLOUD_SCHEDULER_JOB_PREFIX},GCS_TRANSPORT=${_GCS_TRANSPORT},GCS_SIGNING_SERVICE_ACCOUNT=${_GCS_SIGNING_SERVICE_ACCOUNT},SHEETS_LAB_ALLOWED_REDIRECT_URIS=https://admin-web-prod-hsa55rg7ja-uk.a.run.app/owner/connectors
      - --set-secrets=DATABASE_URL=database-url-prod:latest,SHEETS_LAB_OAUTH_CLIENT_ID=sheets-lab-oauth-client-id:latest,SHEETS_LAB_OAUTH_CLIENT_SECRET=sheets-lab-oauth-client-secret:latest

  - id: auth-front-door
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Browser IAP belongs on admin-web-prod, not here.
        # cloud-sdk:slim already ships beta; do not run components install.
        # Fail closed: GIS user tokens cannot pass Cloud Run IAP.
        gcloud beta run services update ${_SERVICE} --region=${_REGION} --project=${_PROJECT} --no-iap --quiet
        PROJECT_NUMBER=95660886550
        COMPUTE_SA="$${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
        IAP_SA="service-$${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com"
        # Compute SA is required: admin-web-prod nginx mints its identity token.
        # Fail the build if this grant does not stick (do not || true).
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member="serviceAccount:$${COMPUTE_SA}" --role=roles/run.invoker --quiet
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member="user:dev-owner-1@example.com" --role=roles/run.invoker --quiet || true
        # allUsers is required: GIS user JWT (aud = OAuth client) cannot
        # pass Cloud Run IAM without it. Fail closed (do not || true).
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member=allUsers --role=roles/run.invoker --quiet
        # Stale IAP-SA invoker is unused once --no-iap; ignore failures.
        gcloud run services remove-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member="serviceAccount:$${IAP_SA}" --role=roles/run.invoker --quiet || true

images:
  - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
