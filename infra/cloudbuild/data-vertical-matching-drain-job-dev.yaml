# Data Vertical Matching drain Job — Method E shell (5 parallel tasks).
# DROP hash + future MDR plaintext; not Auth0/Axios.
# Deploy data-vertical-matching-dev image first (or use this after
# data-vertical-matching-dev.yaml build/push).
# ensure-drain on data-vertical-matching-dev starts executions when
# MATCHING_DRAIN_JOB_NAME is set.
substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _JOB: data-vertical-matching-drain-dev
  _SERVICE_IMAGE: data-vertical-matching-dev
  _TAG: latest
  _TASK_COUNT: "5"
  _CLOUDSQL_INSTANCE: example-gcp-project:us-east4:dpra-dev-temp
  _RUNTIME_SA: 95660886550-compute@developer.gserviceaccount.com

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: deploy-job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        IMAGE="us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE_IMAGE}:${_TAG}"
        gcloud run jobs deploy "${_JOB}" \
          --project="${_PROJECT}" \
          --region="${_REGION}" \
          --image="$${IMAGE}" \
          --tasks="${_TASK_COUNT}" \
          --parallelism="${_TASK_COUNT}" \
          --task-timeout=3600 \
          --max-retries=1 \
          --service-account="${_RUNTIME_SA}" \
          --set-cloudsql-instances="${_CLOUDSQL_INSTANCE}" \
          --command=python \
          --args=-m,matching.chunk_drain \
          --set-env-vars="SERVICE_NAME=matching-drain,WORKER_ID=data-vertical-matching-drain-dev,GCP_PROJECT=${_PROJECT},LOG_LEVEL=INFO,DATABASE_URL=${_DATABASE_URL},MATCHING_DRAIN_MAX_CHUNKS=50,MATCHING_DRAIN_TASK_COUNT=${_TASK_COUNT},MATCHING_DRAIN_LEASE_HOLDER=matching-drain-job,PYTHONPATH=/app/app/matching/src" \
          --quiet

        # data-vertical-matching-dev runtime SA must execute this Job from /ensure-drain.
        gcloud run jobs add-iam-policy-binding "${_JOB}" \
          --project="${_PROJECT}" \
          --region="${_REGION}" \
          --member="serviceAccount:${_RUNTIME_SA}" \
          --role="roles/run.developer" \
          --quiet || true
