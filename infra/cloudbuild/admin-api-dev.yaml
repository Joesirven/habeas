# admin-api-dev — Architecture B resource server. Browser SSO front door is
# admin-web-dev (IAP). This service stays IAM-locked (no allUsers) and
# WITHOUT Cloud Run IAP so the web nginx proxy can invoke it with a
# service-account identity token. Keep IAM locked; do not re-grant
# allUsers in this pipeline. GIS cutover is a separate pin, not this
# yaml. nginx ADMIN_API_UPSTREAM on admin-web-dev remains as fallback.
# ops-ia-web is retired; do not re-add its CORS origin.
# DATABASE_URL from GSM database-url via --set-secrets (not a Cloud Build
# substitution). Comma-delimited --set-env-vars truncates passwords that
# contain commas.
substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _SERVICE: admin-api-dev
  _TAG: latest
  _CLOUDSQL_INSTANCE: example-gcp-project:us-east4:dpra-dev-temp
  _DROP_CONNECTOR_URL: https://drop-connector-dev-hsa55rg7ja-uk.a.run.app
  _DROP_INGESTOR_URL: https://drop-ingestor-dev-hsa55rg7ja-uk.a.run.app
  _REQUEST_DISPATCHER_URL: https://request-dispatcher-dev-hsa55rg7ja-uk.a.run.app
  # Target Cloud Run name is data-vertical-matching-dev; flip _MATCHING_URL after Jose cutover.
  _MATCHING_URL: https://matching-dev-hsa55rg7ja-uk.a.run.app
  _DATA_FULFILLMENT_URL: https://data-fulfillment-dispatcher-dev-hsa55rg7ja-uk.a.run.app
  _HASH_INDEX_REFRESH_URL: https://hash-index-refresh-dev-hsa55rg7ja-uk.a.run.app
  _REAPER_URL: https://reaper-dev-hsa55rg7ja-uk.a.run.app
  _INTAKE_DROP_POLLER_URL: https://intake-drop-poller-dev-hsa55rg7ja-uk.a.run.app
  # App-level identity required (Bearer Google ID token or IAP headers).
  _REQUIRE_IAP_IDENTITY: "true"
  # Browser GIS user ID tokens have aud = this OAuth client (same as VITE_GOOGLE_CLIENT_ID).
  _IAP_OAUTH_CLIENT_ID: "95660886550-cpdl76minmdshvi7vcchcqivkjdna3f7.apps.googleusercontent.com"
  # CLI / nginx ADC tokens have aud = this Cloud Run origin.
  _ADMIN_API_ID_TOKEN_AUDIENCE: "https://admin-api-dev-hsa55rg7ja-uk.a.run.app"
  # admin-web origins for Architecture B GIS. ops-ia-web is retired.
  _CORS_ORIGINS: "https://admin-web-dev-hsa55rg7ja-uk.a.run.app|https://admin-web-prod-hsa55rg7ja-uk.a.run.app|http://127.0.0.1:5174|http://localhost:5174|http://127.0.0.1:5173|http://localhost:5173|http://127.0.0.1:8080|http://localhost:8080"
  _ADMIN_API_SUPER_ADMINS: "dev-owner-1@example.com|dev-owner-9@example.com|dev-owner-6@example.com|dev-owner-12@example.com|dev-owner-4@example.com"
  _ADMIN_API_ADMINS: "dev-owner-3@example.com|dev-owner-13@example.com"
  _ADMIN_API_LEGALS: "dev-owner-3@example.com|dev-owner-5@example.com"
  _ADMIN_API_DATA_OWNERS: "dev-owner-10@example.com|dev-owner-11@example.com|dev-owner-15@example.com|mvirda@example.com|dev-owner-14@example.com|dev-owner-7@example.com"
  # Real V4 signed URLs for fulfillment artifacts; signer needs
  # roles/iam.serviceAccountTokenCreator on itself (signBlob).
  _GCS_TRANSPORT: google
  _GCS_SIGNING_SERVICE_ACCOUNT: 95660886550-compute@developer.gserviceaccount.com
  # Live Cloud Scheduler schedules (Workers Settings / Ops Configuration).
  _CLOUD_SCHEDULER_ENABLED: "true"
  _CLOUD_SCHEDULER_LOCATION: us-east4
  _CLOUD_SCHEDULER_JOB_PREFIX: dpra-dev
  # Owner mapped-upload CSVs (connections/{system}/{connection_id}/upload.csv).
  _CONNECTIONS_UPLOAD_BUCKET: gs://example-gcp-project-dpra-uploads

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - -f
      - app/admin_api/Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --timeout=3600
      - --set-env-vars=SERVICE_NAME=admin-api,WORKER_ID=admin-api-dev,GCP_PROJECT=${_PROJECT},LOG_LEVEL=INFO,DROP_CONNECTOR_URL=${_DROP_CONNECTOR_URL},DROP_INGESTOR_URL=${_DROP_INGESTOR_URL},REQUEST_DISPATCHER_URL=${_REQUEST_DISPATCHER_URL},MATCHING_URL=${_MATCHING_URL},DATA_FULFILLMENT_URL=${_DATA_FULFILLMENT_URL},HASH_INDEX_REFRESH_URL=${_HASH_INDEX_REFRESH_URL},REAPER_URL=${_REAPER_URL},INTAKE_DROP_POLLER_URL=${_INTAKE_DROP_POLLER_URL},CONNECTIONS_UPLOAD_BUCKET=${_CONNECTIONS_UPLOAD_BUCKET},REQUIRE_IAP_IDENTITY=${_REQUIRE_IAP_IDENTITY},IAP_OAUTH_CLIENT_ID=${_IAP_OAUTH_CLIENT_ID},ADMIN_API_ID_TOKEN_AUDIENCE=${_ADMIN_API_ID_TOKEN_AUDIENCE},CORS_ORIGINS=${_CORS_ORIGINS},ADMIN_API_SUPER_ADMINS=${_ADMIN_API_SUPER_ADMINS},ADMIN_API_ADMINS=${_ADMIN_API_ADMINS},ADMIN_API_LEGALS=${_ADMIN_API_LEGALS},ADMIN_API_DATA_OWNERS=${_ADMIN_API_DATA_OWNERS},CLOUD_SCHEDULER_ENABLED=${_CLOUD_SCHEDULER_ENABLED},CLOUD_SCHEDULER_LOCATION=${_CLOUD_SCHEDULER_LOCATION},CLOUD_SCHEDULER_JOB_PREFIX=${_CLOUD_SCHEDULER_JOB_PREFIX},GCS_TRANSPORT=${_GCS_TRANSPORT},GCS_SIGNING_SERVICE_ACCOUNT=${_GCS_SIGNING_SERVICE_ACCOUNT}
      - --set-secrets=DATABASE_URL=database-url:latest

  - id: auth-front-door
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Browser IAP belongs on admin-web-dev, not here.
        # cloud-sdk:slim already ships beta; do not run components install.
        # Fail closed: GIS user tokens cannot pass Cloud Run IAP.
        gcloud beta run services update ${_SERVICE} --region=${_REGION} --project=${_PROJECT} --no-iap --quiet
        PROJECT_NUMBER=95660886550
        COMPUTE_SA="$${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
        IAP_SA="service-$${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com"
        # Compute SA is required: admin-web-dev nginx mints its identity token.
        # Fail the build if this grant does not stick (do not || true).
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member="serviceAccount:$${COMPUTE_SA}" --role=roles/run.invoker --quiet
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member="user:dev-owner-1@example.com" --role=roles/run.invoker --quiet || true
        # Strip leftover public invoker. Binding already gone is success;
        # any other error fails the build (do not || true).
        strip_out=$$(gcloud run services remove-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member=allUsers --role=roles/run.invoker --quiet 2>&1) && strip_rc=0 || strip_rc=$$?
        if [[ $${strip_rc} -ne 0 ]]; then
          if [[ "$${strip_out}" != *"Policy binding"* || "$${strip_out}" != *"not found"* ]]; then
            echo "$${strip_out}" >&2
            exit $${strip_rc}
          fi
        fi
        # Stale IAP-SA invoker is unused once --no-iap; ignore failures.
        gcloud run services remove-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member="serviceAccount:$${IAP_SA}" --role=roles/run.invoker --quiet || true

images:
  - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
