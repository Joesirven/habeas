substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _SERVICE: admin-api-dev
  _TAG: latest
  _CLOUDSQL_INSTANCE: example-gcp-project:us-east4:dpra-dev-temp
  _DROP_CONNECTOR_URL: https://drop-connector-dev-hsa55rg7ja-uk.a.run.app
  _DROP_INGESTOR_URL: https://drop-ingestor-dev-hsa55rg7ja-uk.a.run.app
  _REQUEST_DISPATCHER_URL: https://request-dispatcher-dev-hsa55rg7ja-uk.a.run.app
  _MATCHING_URL: https://matching-dev-hsa55rg7ja-uk.a.run.app
  _DATA_FULFILLMENT_URL: https://data-fulfillment-dispatcher-dev-hsa55rg7ja-uk.a.run.app
  _CORS_ORIGINS: "https://example-gcp-project-dev.web.app|https://example-gcp-project-data-privacy-dev.web.app|http://127.0.0.1:5173"

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - -f
      - app/admin_api/Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --set-env-vars=SERVICE_NAME=admin-api,WORKER_ID=admin-api-dev,GCP_PROJECT=${_PROJECT},LOG_LEVEL=INFO,DATABASE_URL=${_DATABASE_URL},DROP_CONNECTOR_URL=${_DROP_CONNECTOR_URL},DROP_INGESTOR_URL=${_DROP_INGESTOR_URL},REQUEST_DISPATCHER_URL=${_REQUEST_DISPATCHER_URL},MATCHING_URL=${_MATCHING_URL},DATA_FULFILLMENT_URL=${_DATA_FULFILLMENT_URL},CORS_ORIGINS=${_CORS_ORIGINS}

images:
  - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
