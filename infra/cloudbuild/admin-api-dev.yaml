# admin-api-dev — browser SSO front door is ops-ia-web-dev / admin-web-dev (IAP).
# This service stays IAM-locked (no allUsers) and WITHOUT Cloud Run IAP so the
# web nginx proxy can invoke it with a service-account identity token and
# forward X-Goog-Authenticated-User-* headers from the user's IAP session.
substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _SERVICE: admin-api-dev
  _TAG: latest
  _CLOUDSQL_INSTANCE: example-gcp-project:us-east4:dpra-dev-temp
  _DROP_CONNECTOR_URL: https://drop-connector-dev-hsa55rg7ja-uk.a.run.app
  _DROP_INGESTOR_URL: https://drop-ingestor-dev-hsa55rg7ja-uk.a.run.app
  _REQUEST_DISPATCHER_URL: https://request-dispatcher-dev-hsa55rg7ja-uk.a.run.app
  _MATCHING_URL: https://matching-dev-hsa55rg7ja-uk.a.run.app
  _DATA_FULFILLMENT_URL: https://data-fulfillment-dispatcher-dev-hsa55rg7ja-uk.a.run.app
  _HASH_INDEX_REFRESH_URL: https://hash-index-refresh-dev-hsa55rg7ja-uk.a.run.app
  # App-level identity required (headers from web proxy after IAP).
  _REQUIRE_IAP_IDENTITY: "true"
  _CORS_ORIGINS: "https://ops-ia-web-dev-hsa55rg7ja-uk.a.run.app|https://admin-web-dev-hsa55rg7ja-uk.a.run.app|http://127.0.0.1:5174|http://localhost:5174|http://127.0.0.1:5173|http://localhost:5173|http://127.0.0.1:8080|http://localhost:8080"
  _ADMIN_API_SUPER_ADMINS: "dev-owner-1@example.com|dev-owner-9@example.com|dev-owner-6@example.com|dev-owner-12@example.com|dev-owner-4@example.com"
  # Live Cloud Scheduler schedules (Workers Settings / Ops Configuration).
  _CLOUD_SCHEDULER_ENABLED: "true"
  _CLOUD_SCHEDULER_LOCATION: us-east4
  _CLOUD_SCHEDULER_JOB_PREFIX: dpra-dev

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - -f
      - app/admin_api/Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --timeout=3600
      - --set-env-vars=SERVICE_NAME=admin-api,WORKER_ID=admin-api-dev,GCP_PROJECT=${_PROJECT},LOG_LEVEL=INFO,DATABASE_URL=${_DATABASE_URL},DROP_CONNECTOR_URL=${_DROP_CONNECTOR_URL},DROP_INGESTOR_URL=${_DROP_INGESTOR_URL},REQUEST_DISPATCHER_URL=${_REQUEST_DISPATCHER_URL},MATCHING_URL=${_MATCHING_URL},DATA_FULFILLMENT_URL=${_DATA_FULFILLMENT_URL},HASH_INDEX_REFRESH_URL=${_HASH_INDEX_REFRESH_URL},REQUIRE_IAP_IDENTITY=${_REQUIRE_IAP_IDENTITY},CORS_ORIGINS=${_CORS_ORIGINS},ADMIN_API_SUPER_ADMINS=${_ADMIN_API_SUPER_ADMINS},CLOUD_SCHEDULER_ENABLED=${_CLOUD_SCHEDULER_ENABLED},CLOUD_SCHEDULER_LOCATION=${_CLOUD_SCHEDULER_LOCATION},CLOUD_SCHEDULER_JOB_PREFIX=${_CLOUD_SCHEDULER_JOB_PREFIX}

  - id: auth-front-door
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        # Browser IAP belongs on ops-ia-web-dev / admin-web-dev, not here.
        # cloud-sdk:slim already ships beta; do not run components install.
        gcloud beta run services update ${_SERVICE} --region=${_REGION} --project=${_PROJECT} --no-iap --quiet || true
        PROJECT_NUMBER=95660886550
        COMPUTE_SA="$${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
        IAP_SA="service-$${PROJECT_NUMBER}@gcp-sa-iap.iam.gserviceaccount.com"
        # Compute SA is required: ops-ia-web-dev nginx mints its identity token.
        # Fail the build if this grant does not stick (do not || true).
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member="serviceAccount:$${COMPUTE_SA}" --role=roles/run.invoker --quiet
        gcloud run services add-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member="user:dev-owner-1@example.com" --role=roles/run.invoker --quiet || true
        gcloud run services remove-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member=allUsers --role=roles/run.invoker --quiet || true
        # Stale IAP-SA invoker is unused once --no-iap; ignore failures.
        gcloud run services remove-iam-policy-binding ${_SERVICE} \
          --region=${_REGION} --project=${_PROJECT} \
          --member="serviceAccount:$${IAP_SA}" --role=roles/run.invoker --quiet || true

images:
  - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
