substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _REPOSITORY: data-privacy
  _SERVICE: reaper
  _IMAGE: ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPOSITORY}/${_SERVICE}:${SHORT_SHA}

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: test
    name: python:3.12-slim
    entrypoint: bash
    args:
      - -c
      - |
        set -euo pipefail
        apt-get update && apt-get install -y curl
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="/root/.local/bin:$$PATH"
        uv sync --all-packages
        uv run --group dev pytest
        uv run lint-imports

  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_IMAGE}
      - -f
      - app/reaper/Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

  - id: migrate
    name: amacneil/dbmate:2.21.0
    entrypoint: sh
    args:
      - -c
      - dbmate -d db/migrations up
    secretEnv:
      - DATABASE_URL

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=SERVICE_NAME=reaper,GCP_PROJECT=${_PROJECT},LOG_LEVEL=INFO
      - --set-secrets=DATABASE_URL=database-url:latest

availableSecrets:
  secretManager:
    - versionName: projects/${_PROJECT}/secrets/database-url/versions/latest
      env: DATABASE_URL

images:
  - ${_IMAGE}
