# Admin web IAP front door — same pattern as admin-web-dev.
# Browser Google login via IAP; same-origin /api/*; nginx mints Cloud Run
# invoker token and forwards X-Goog-Authenticated-User-* to admin-api.
# Architecture B (GIS direct to admin-api) is dev-only until GIS /me is proven.
#
# Post-deploy curl checklist (IAP session or super_admin ADC via /api):
#   curl -sS -o /dev/null -w '%{http_code} %{time_total}s\n' \
#     https://admin-web-prod-hsa55rg7ja-uk.a.run.app/
#   time curl -sS -H "Authorization: Bearer $TOKEN" \
#     https://admin-web-prod-hsa55rg7ja-uk.a.run.app/api/ops/drop/matching-progress | head -c 200
substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _SERVICE: admin-web-prod
  _TAG: latest
  # Same-origin /api — do not bake a cross-origin admin-api URL.
  # Absolute VITE_ADMIN_API_URL makes the browser call admin-api-prod directly;
  # GIS One Tap often fails behind IAP (skipped/not displayed) → "Could not sign in with Google".
  # Prove GIS on admin-web-dev before flipping prod to Architecture B.
  _VITE_ADMIN_API_URL: ""
  _VITE_GOOGLE_CLIENT_ID: ""
  # Labs are DEV-only — never enable on admin-web-prod.
  _VITE_ENABLE_LABS: "false"
  _ADMIN_API_UPSTREAM: https://admin-api-prod-hsa55rg7ja-uk.a.run.app

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --build-arg
      - VITE_ADMIN_API_URL=${_VITE_ADMIN_API_URL}
      - --build-arg
      - VITE_GOOGLE_CLIENT_ID=${_VITE_GOOGLE_CLIENT_ID}
      - --build-arg
      - VITE_ENABLE_LABS=${_VITE_ENABLE_LABS}
      - -f
      - clients/web/Dockerfile
      - clients/web

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --port=8080
      - --memory=256Mi
      - --cpu=1
      - --max-instances=3
      - --min-instances=1
      - --set-env-vars=ADMIN_API_UPSTREAM=${_ADMIN_API_UPSTREAM}

  - id: enable-iap
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        # cloud-sdk:slim already ships beta; do not run components install.
        gcloud beta run services update ${_SERVICE} --region=${_REGION} --project=${_PROJECT} --iap --quiet
        gcloud run services add-iam-policy-binding ${_SERVICE} --region=${_REGION} --project=${_PROJECT} \
          --member=serviceAccount:service-95660886550@gcp-sa-iap.iam.gserviceaccount.com \
          --role=roles/run.invoker --quiet || true
        gcloud run services remove-iam-policy-binding ${_SERVICE} --region=${_REGION} --project=${_PROJECT} \
          --member=allUsers --role=roles/run.invoker --quiet || true
        gcloud beta iap web add-iam-policy-binding --project=${_PROJECT} --region=${_REGION} \
          --resource-type=cloud-run --service=${_SERVICE} \
          --member=user:dev-owner-1@example.com --role=roles/iap.httpsResourceAccessor \
          --condition=None --quiet || true
        # Habeas Workspace domain — same operator login path as admin-web-dev.
        gcloud beta iap web add-iam-policy-binding --project=${_PROJECT} --region=${_REGION} \
          --resource-type=cloud-run --service=${_SERVICE} \
          --member=domain:habeas.us --role=roles/iap.httpsResourceAccessor \
          --condition=None --quiet || true
        gcloud beta iap web add-iam-policy-binding --project=${_PROJECT} --region=${_REGION} \
          --resource-type=cloud-run --service=${_SERVICE} \
          --member=user:dev-owner-4@example.com --role=roles/iap.httpsResourceAccessor \
          --condition=None --quiet || true
        gcloud beta iap web add-iam-policy-binding --project=${_PROJECT} --region=${_REGION} \
          --resource-type=cloud-run --service=${_SERVICE} \
          --member=user:dev-owner-3@example.com --role=roles/iap.httpsResourceAccessor \
          --condition=None --quiet || true

images:
  - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
