# request-dispatcher-prod — twin of request-dispatcher-dev.
# Cloud SQL dpra-prod + _DATABASE_URL substitution.
substitutions:
  _REGION: us-east4
  _PROJECT: example-gcp-project
  _SERVICE: request-dispatcher-prod
  _TAG: latest
  _CLOUDSQL_INSTANCE: example-gcp-project:us-east4:dpra-prod

options:
  logging: CLOUD_LOGGING_ONLY

steps:
  - id: build
    name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - -f
      - app/request_dispatcher/Dockerfile
      - .

  - id: push
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
      - --region=${_REGION}
      - --platform=managed
      - --no-allow-unauthenticated
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --set-env-vars=SERVICE_NAME=request-dispatcher,WORKER_ID=request-dispatcher-prod,GCP_PROJECT=${_PROJECT},LOG_LEVEL=INFO,DATABASE_URL=${_DATABASE_URL}

  # admin-api runtime SA only — never user/IAP run.invoker on workers. Never allUsers.
  - id: grant-admin-api-invoker
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - services
      - add-iam-policy-binding
      - ${_SERVICE}
      - --region=${_REGION}
      - --member=serviceAccount:95660886550-compute@developer.gserviceaccount.com
      - --role=roles/run.invoker
      - --quiet

images:
  - us-east4-docker.pkg.dev/${_PROJECT}/data-privacy/${_SERVICE}:${_TAG}
