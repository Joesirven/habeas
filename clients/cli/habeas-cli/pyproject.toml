[project]
name = "habeas-cli"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "habeas-privacy-core",
    "typer>=0.15",
    "rich>=13.9",
    "httpx>=0.28",
    "google-auth>=2.36",
    "asyncpg>=0.30",
    "sqlglot>=26.0",
]

[project.scripts]
habeas-cli = "habeas_cli.main:app"

[tool.uv.sources]
habeas-privacy-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habeas_cli"]
