# Local iteration for admin web.
#   docker compose up web-dev   # hot reload on :5173
#   docker compose up web       # production-like nginx on :8080

services:
  web-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    environment:
      VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-https://admin-api-dev-hsa55rg7ja-uk.a.run.app}
    volumes:
      # Live-edit source without reinstalling deps inside the VM
      - ./src:/app/src
      - ./index.html:/app/index.html
      - ./vite.config.ts:/app/vite.config.ts
      - ./public:/app/public

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_ADMIN_API_URL: ${VITE_ADMIN_API_URL:-https://admin-api-dev-hsa55rg7ja-uk.a.run.app}
    ports:
      - "8080:8080"
