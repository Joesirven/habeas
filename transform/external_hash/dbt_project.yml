name: external_hash
version: 1.0.0
config-version: 2

profile: external_hash

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

clean-targets:
  - target
  - dbt_packages
  - logs

vars:
  # OQ1 (deferred): confirm dataset name with Jose before prod apply.
  perform_serving_swap: true

# Build+swap on-run-end deferred until per-system swap macros land — see macros/README.md.
# on-run-end:
#   - "{{ perform_serving_swap() if var('perform_serving_swap', true) }}"

models:
  external_hash:
    staging:
      +tags: [staging]
      +materialized: view
    marts:
      +tags: [mart]
      +materialized: table
