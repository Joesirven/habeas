version: 2

sources:
  - name: external_hash_index
    database: example-gcp-project
    schema: external_hash_index
    description: >
      Hashed raw extracts from external vertical hash-refresh workers. Every
      column is either an opaque vendor id, a DROP-compatible Base64 hash, or
      metadata — never plaintext email, phone, name, DOB, or ZIP.
    tables:
      - name: auth0_hashed_raw
        description: >
          Auth0 Management hashed extract. Populated by the auth0
          hash-refresh worker after in-memory standardize+hash (CPPA DROP v1.2.0).
        columns:
          - name: email_hash
            description: Base64(SHA-256) of DROP-standardized email (nullable)
          - name: phone_hash
            description: Base64(SHA-256) of DROP-standardized 10-digit phone (nullable)
          - name: ndz_hash
            description: >
              Base64(SHA-256) of concat of FN/LN/DOB/ZIP Base64 digests (nullable)
          - name: vendor_record_id
            description: Opaque Auth0 user id (user_id vocabulary stays in app)
            tests:
              - unique
              - not_null
          - name: system
            description: Bounded context identifier (e.g. auth0)
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ['auth0']
          - name: extracted_at
            description: When the extract worker wrote this row
            tests:
              - not_null
      - name: axios_headquarters_hashed_raw
        description: >
          Axios Headquarters hashed extract. Populated by the communications
          hash-refresh worker after in-memory standardize+hash (CPPA DROP v1.2.0).
        columns:
          - name: email_hash
            description: Base64(SHA-256) of DROP-standardized email (nullable)
          - name: phone_hash
            description: Base64(SHA-256) of DROP-standardized 10-digit phone (nullable)
          - name: ndz_hash
            description: >
              Base64(SHA-256) of concat of FN/LN/DOB/ZIP Base64 digests (nullable)
          - name: vendor_record_id
            description: Opaque Axios Headquarters row id
          - name: system
            description: Bounded context identifier (axios_headquarters)
          - name: extracted_at
            description: When the extract worker wrote this row
      - name: paylocity_hashed_raw
        description: >
          Paylocity hashed extract. Populated by the paylocity hash-refresh
          worker after in-memory standardize+hash (CPPA DROP v1.2.0).
        columns:
          - name: email_hash
            description: Base64(SHA-256) of DROP-standardized email (nullable)
          - name: phone_hash
            description: Base64(SHA-256) of DROP-standardized 10-digit phone (nullable)
          - name: ndz_hash
            description: >
              Base64(SHA-256) of concat of FN/LN/DOB/ZIP Base64 digests (nullable)
          - name: vendor_record_id
            description: Opaque Paylocity employee id
          - name: system
            description: Bounded context identifier (paylocity)
          - name: extracted_at
            description: When the extract worker wrote this row
      - name: lever_hashed_raw
        description: >
          Lever hashed extract. Populated by the lever hash-refresh worker
          after in-memory standardize+hash (CPPA DROP v1.2.0).
        columns:
          - name: email_hash
            description: Base64(SHA-256) of DROP-standardized email (nullable)
          - name: phone_hash
            description: Base64(SHA-256) of DROP-standardized 10-digit phone (nullable)
          - name: ndz_hash
            description: >
              Base64(SHA-256) of concat of FN/LN/DOB/ZIP Base64 digests (nullable)
          - name: vendor_record_id
            description: Opaque Lever candidate id
          - name: system
            description: Bounded context identifier (lever)
          - name: extracted_at
            description: When the extract worker wrote this row
      - name: hr_alumni_hashed_raw
        description: >
          Alumni Google Sheet hashed extract. Populated by the sheets
          hash-refresh worker after in-memory standardize+hash (CPPA DROP v1.2.0).
        columns:
          - name: email_hash
            description: Base64(SHA-256) of DROP-standardized email (nullable)
          - name: phone_hash
            description: Base64(SHA-256) of DROP-standardized 10-digit phone (nullable)
          - name: ndz_hash
            description: >
              Base64(SHA-256) of concat of FN/LN/DOB/ZIP Base64 digests (nullable)
          - name: vendor_record_id
            description: Opaque Alumni sheet row id
          - name: system
            description: Bounded context identifier (hr_alumni)
          - name: extracted_at
            description: When the extract worker wrote this row
      - name: bizdev_contacts_hashed_raw
        description: >
          Contact Us Google Sheet hashed extract. Populated by the sheets
          hash-refresh worker after in-memory standardize+hash (CPPA DROP v1.2.0).
        columns:
          - name: email_hash
            description: Base64(SHA-256) of DROP-standardized email (nullable)
          - name: phone_hash
            description: Base64(SHA-256) of DROP-standardized 10-digit phone (nullable)
          - name: ndz_hash
            description: >
              Base64(SHA-256) of concat of FN/LN/DOB/ZIP Base64 digests (nullable)
          - name: vendor_record_id
            description: Opaque Contact Us sheet row id
          - name: system
            description: Bounded context identifier (bizdev_contacts)
          - name: extracted_at
            description: When the extract worker wrote this row
