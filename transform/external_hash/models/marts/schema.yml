version: 2

models:
  - name: mart_mailchimp_email_hash
    description: >
      Durable Mailchimp email serving build (mailchimp_email_hash__build); swapped
      into national mailchimp_email_hash serving table per macros/README.md.
      Clustered (system, hash_value).
    columns:
      - name: hash_value
        description: Base64(SHA-256) of DROP-standardized email (from hashed raw)
        tests:
          - not_null
      - name: vendor_record_id
        description: Opaque Mailchimp member id for suppression adapter lookup
        tests:
          - not_null
      - name: system
        description: Bounded context identifier (mailchimp)
        tests:
          - not_null
      - name: built_at
        description: Timestamp when this mart row was written
        tests:
          - not_null
  - name: stg_auth0_hashed
    description: >
      Auth0 hashed-raw staging. Filtered to system = 'auth0' and non-null
      email_hash. Grain is one row per Auth0 user_id (vendor_record_id).
    columns:
      - name: email_hash
        description: Base64(SHA-256) of DROP-standardized email (from hashed raw)
        tests:
          - not_null
      - name: vendor_record_id
        description: Opaque Auth0 user id for suppression adapter lookup
        tests:
          - unique
          - not_null
      - name: system
        description: Bounded context identifier (auth0)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['auth0']
      - name: extracted_at
        description: When the extract worker wrote this row
        tests:
          - not_null
  - name: mart_auth0_email_hash
    description: >
      Durable Auth0 email serving build (auth0_email_hash__build); swapped
      into national auth0_email_hash serving table per macros/README.md.
      Clustered (system, hash_value). Grain is one row per Auth0 user_id.
    columns:
      - name: hash_value
        description: Base64(SHA-256) of DROP-standardized email (from hashed raw)
        tests:
          - not_null
      - name: vendor_record_id
        description: Opaque Auth0 user id for suppression adapter lookup
        tests:
          - unique
          - not_null
      - name: system
        description: Bounded context identifier (auth0)
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['auth0']
      - name: built_at
        description: Timestamp when this mart row was written
        tests:
          - not_null
