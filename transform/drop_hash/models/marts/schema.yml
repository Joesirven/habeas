version: 2

models:
  - name: mart_email_hash
    description: >
      Durable per-state serving staging (email_hash__build_<state>); patched into
      national email_hash by state. Clustered (state, hash_value).
    columns:
      - name: hash_value
        description: Base64(SHA-256) of DROP-standardized email
        tests:
          - not_null
      - name: dwid
        description: Habeas MDR person id (string)
        tests:
          - not_null
      - name: state
        description: Two-letter state from var('state')
        tests:
          - not_null
      - name: built_at
        description: Timestamp when this build row was written
        tests:
          - not_null

  - name: mart_phone_hash
    description: >
      Durable per-state phone staging (phone_hash__build_<state> → phone_hash).
      Cell and land are separate rows when both exist. Clustered (state, hash_value).
    columns:
      - name: hash_value
        description: Base64(SHA-256) of DROP-standardized 10-digit phone
        tests:
          - not_null
      - name: dwid
        tests:
          - not_null
      - name: state
        tests:
          - not_null
      - name: built_at
        tests:
          - not_null

  - name: mart_ndz_hash
    description: >
      Durable per-state NDZ staging (ndz_hash__build_<state> → ndz_hash).
      Built from name UDF + dob/zip ints. Clustered (state, hash_value).
    columns:
      - name: hash_value
        description: Base64(SHA-256) of concat of FN/LN/DOB/ZIP Base64 digests
        tests:
          - not_null
      - name: dwid
        tests:
          - not_null
      - name: state
        tests:
          - not_null
      - name: built_at
        tests:
          - not_null
