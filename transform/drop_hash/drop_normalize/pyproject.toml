[project]
name = "drop-normalize"
version = "0.1.0"
description = "DROP v1.2.0 identifier standardization and hashing (CPPA golden vectors)"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drop_normalize"]

[tool.pytest.ini_options]
# Local package config (do not inherit root asyncio_mode — no pytest-asyncio here).
testpaths = ["tests"]
pythonpath = ["src"]
