[project]
name = "habeas-privacy-core"
version = "0.1.0"
description = "Shared library for Habeas data privacy automation"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "asyncpg>=0.30",
    "httpx>=0.28",
    "tenacity>=9.0",
    "email-validator>=2.0",
    "opentelemetry-api>=1.29",
    "opentelemetry-sdk>=1.29",
    "opentelemetry-exporter-gcp-trace>=1.9",
    "starlette>=0.41",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/habeas_privacy_core"]
